<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="Helvetica, Arial, sans-serif"><title>C: broadband, term by term</title><rect width="680" height="420" fill="#FFFFFF"/><text x="340" y="26" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">C_i = m_b · N(0, σ_b,i),   σ_b,i = √( D_i / 2h ),   D_i = c_i · activity^p_b</text><rect x="30" y="44" width="300" height="160" rx="8" fill="none" stroke="#D3D1C7"/><text x="46" y="66" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="start">activity: how much the whole arm moves</text><rect x="70" y="140" width="30" height="30" fill="#9FE1CB"/><rect x="110" y="120" width="30" height="50" fill="#9FE1CB"/><rect x="150" y="150" width="30" height="20" fill="#9FE1CB"/><text x="85" y="186" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">j1</text><text x="125" y="186" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">j2</text><text x="165" y="186" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">j3</text><text x="200" y="150" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">Σ f_m,j / f_ref</text><text x="46" y="198" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">sum of every joint's motor speed</text><rect x="350" y="44" width="300" height="160" rx="8" fill="none" stroke="#D3D1C7"/><text x="366" y="66" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="start">white noise: every frequency</text><line x1="370" y1="160" x2="630" y2="160" stroke="#D3D1C7"/><path d="M370 150 L374 148.4 L378 150.3 L382 149.2 L386 150.6 L390 150.8 L394 147.4 L398 147.1 L402 152.0 L406 148.6 L410 148.4 L414 153.0 L418 149.8 L422 152.0 L426 149.9 L430 150.8 L434 147.9 L438 150.8 L442 152.2 L446 150.1 L450 151.4 L454 151.0 L458 147.4 L462 151.5 L466 150.5 L470 148.8 L474 147.2 L478 152.2 L482 149.8 L486 151.3 L490 152.3 L494 151.3 L498 152.5 L502 149.4 L506 151.8 L510 149.7 L51