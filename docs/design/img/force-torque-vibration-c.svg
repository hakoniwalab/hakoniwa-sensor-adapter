E5A" text-anchor="middle">m_b</text><line x1="509" y1="310" x2="621" y2="310" stroke="#D3D1C7" stroke-dasharray="3 3"/><circle cx="533" cy="298" r="5" fill="#888780"/><circle cx="565" cy="324" r="5" fill="#888780"/><circle cx="597" cy="304" r="5" fill="#888780"/><text x="564.0" y="356" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">runs 1, 2, 3</text><text x="564.0" y="378" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle">run multiplier</text><text x="564.0" y="394" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">one draw a run</text></svg>