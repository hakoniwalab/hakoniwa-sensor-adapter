<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="Helvetica, Arial, sans-serif"><title>A: gear orders, term by term</title><rect width="680" height="420" fill="#FFFFFF"/><text x="340" y="26" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">A_i = Σ_j Σ_k  g_j · m_j · a_{j,k,i} · (f_m,j / f_ref)^p · min(1, f_m,j / f_dead,j) · sin(k · φ_j + θ)</text><rect x="30" y="44" width="300" height="160" rx="8" fill="none" stroke="#D3D1C7"/><text x="46" y="66" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="start">Σ_j Σ_k: every joint, every order</text><rect x="60" y="176" width="60" height="12" rx="2" fill="none" stroke="#888780"/><path d="M90 176 L130 112 L210 96 L262 122" fill="none" stroke="#5F5E5A" stroke-width="5" stroke-linecap="round"/><circle cx="90" cy="172" r="9" fill="none" stroke="#D85A30" stroke-width="3" stroke-dasharray="3 2"><animateTransform attributeName="transform" type="rotate" from="0 90 172" to="360 90 172" dur="4s" repeatCount="indefinite"/></circle><circle cx="130" cy="112" r="9" fill="none" stroke="#D85A30" stroke-width="3" stroke-dasharray="3 2"><animateTransform attributeName="transform" type="rotate" from="0 130 112" to="360 130 112" dur="3s" repeatCount="indefinite"/></circle><circle cx="210" cy="96" r="9" fill="none" stroke="#D85A30" stroke-width="3" stroke-dasharray="3 2"><animateTransform attributeName="transform" type="rotate" from="0 210 96" to="360 210 96" dur="2s" repeatCount="indefinite"/></circle><rect x="258" y="118" width="14" height="14" rx="2" fill="#1D9E75"/><text x="100" y="146" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">joint 1</text><text x="140" y="90" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">joint 2</text><text x="198" y="82" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">joint 3</text><text x="232" y="150" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">sensor</text><text x="46" y="198" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">each joint has a gear; all of them reach the sensor</text><rect x="350" y="44" width="300" height="160" rx="8" fill="none" stroke="#D3D1C7"/><text x="366" y="66" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="start">each line sits at k × f_m,j</text><line x1="370" y1="160" x2="630" y2="160" stroke="#D3D1C7"/><line x1="420" y1="160" x2="420" y2="90" stroke="#D85A30" stroke-width="2"/><line x1="490" y1="160" x2="490" y2="120" stroke="#D85A30" stroke-width="2"/><line x1="450" y1="160" x2="450" y2="104" stroke="#1D9E75" stroke-width="2"/><line x1="550" y1="160" x2="550" y2="132" stroke="#1D9E75" stroke-width="2"/><text x="420" y="176" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">k=2</text><text x="490" y="176" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">k=4</text><text x="625" y="176" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="end">Hz</text><text x="366" y="194" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">colour = joint; f_m,j = N_j · |q̇_j| / 2π</text><rect x="30" y="224" width="96" height="176" rx="8" fill="none" stroke="#D3D1C7"/><text x="78.0" y="246" font-size="12" font-weight="500" fill="#D85A30" text-anchor="middle">g_j</text><rect x="48" y="300" width="20" height="40" fill="#F0997B"/><rect x="86" y="276" width="20" height="64" fill="#D85A30"/><text x="58" y="356" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">lift</text><text x="96" y="356" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">lower</text><text x="78.0" y="356" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle"></text><text x="78.0" y="378" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle">load direction</text><text x="78.0" y="394" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">lowering: larger</text><rect x="133" y="224" width="96" height="176" rx="8" fill="none" stroke="#D3D1C7"/><text x="181.0" y="246" font-size="12" font-weight="500" fill="#D85A30" text-anchor="middle">m_j</text><line x1="145" y1="310" x2="217" y2="310" stroke="#D3D1C7" stroke-dasharray="3 3"/><circle cx="157" cy="296" r="5" fill="#D85A30"/><circle cx="181" cy="322" r="5" fill="#D85A30"/><circle cx="205" cy="304" r="5" fill="#D85A30"/><text x="181.0" y="356" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">runs 1, 2, 3</text><text x="181.0" y="378" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle">run multiplier</text><text x="181.0" y="394" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">one draw a run</text><rect x="236" y="224" width="96" height="176" rx="8" fill="none" stroke="#D3D1C7"/><text x="284.0" y="246" font-size="12" font-weight="500" fill="#D85A30" text-anchor="middle">a_{j,k,i}</text><rect x="248" y="296" width="9" height="44" fill="#D85A30"/><rect x="260" y="316" width="9" height="24" fill="#D85A30"/><rect x="272" y="280" width="9" height="60" fill="#D85A30"/><rect x="284" y="330" width="9" height="10" fill="#D85A30"/><rect x="296" y="322" width="9" height="18" fill="#D85A30"/><rect x="308" y="336" width="9" height="4" fill="#D85A30"/><text x="284.0" y="356" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">Fx … Tz</text><text x="284.0" y="378" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle">per sensor axis</text><text x="284.0" y="394" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">path included</text><rect x="339" y="224" width="96" height="176" rx="8" fill="none" stroke="#D3D1C7"/><text x="387.0" y="246" font-size="12" font-weight="500" fill="#D85A30" text-anchor="middle">(f_m / f_ref)^p</text><line x1="351" y1="340" x2="423" y2="340" stroke="#D3D1C7"/><path d="M351 304 L423 304" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="3 2"/><path d="M351 338 Q380 318 423 284" fill="none" stroke="#D85A30" stroke-width="1.5"/><text x="387.0" y="356" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">speed →</text><text x="387.0" y="378" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle">speed growth</text><text x="387.0" y="394" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">p = 0: flat</text><rect x="442" y="224" width="96" height="176" rx="8" fill="none" stroke="#D3D1C7"/><text x="490.0" y="246" font-size="12" font-weight="500" fill="#D85A30" text-anchor="middle">min(1, f_m/f_dead)</text><line x1="454" y1="340" x2="526" y2="340" stroke="#D3D1C7"/><path d="M454 340 L472 290 L526 290" fill="none" stroke="#D85A30" stroke-width="1.5"/><text x="490.0" y="356" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">speed →</text><text x="490.0" y="378" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle">fades at rest</text><text x="490.0" y="394" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">below f_dead</text><rect x="545" y="224" width="96" height="176" rx="8" fill="none" stroke="#D3D1C7"/><text x="593.0" y="246" font-size="12" font-weight="500" fill="#D85A30" text-anchor="middle">sin(k · φ_j + θ)</text><path d="M555 312 Q561 288 567 312 T579 312 T591 312 T603 312 T615 312 T627 312" fill="none" stroke="#D85A30" stroke-width="1.5"/><text x="593.0" y="356" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">time →</text><text x="593.0" y="378" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle">teeth mesh</text><text x="593.0" y="394" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">k per motor turn</text></svg>