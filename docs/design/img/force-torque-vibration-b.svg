<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="Helvetica, Arial, sans-serif"><title>B: arm modes, term by term</title><rect width="680" height="420" fill="#FFFFFF"/><text x="340" y="26" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">B_i = Σ_n σ_{n,i} · x_n(t),   σ = s0 · keep + m_n · ( s1 · activity + s2 · min(1, activity / a_r) )</text><rect x="30" y="44" width="300" height="160" rx="8" fill="none" stroke="#D3D1C7"/><text x="46" y="66" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="start">Σ_n: every arm mode</text><rect x="60" y="176" width="60" height="12" rx="2" fill="none" stroke="#888780"/><g><path d="M90 176 L130 112 L210 96 L262 122" fill="none" stroke="#1D9E75" stroke-width="5" stroke-linecap="round"/><animateTransform attributeName="transform" type="rotate" values="-2 90 176;2 90 176;-2 90 176" dur="0.9s" repeatCount="indefinite"/></g><rect x="258" y="118" width="14" height="14" rx="2" fill="#1D9E75"/><text x="232" y="150" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">sensor</text><path d="M100 150 l-6 -4 M100 160 l-7 0 M80 150 l6 -4 M80 160 l7 0" stroke="#D85A30" stroke-width="1.5" fill="none"/><text x="46" y="198" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">the whole arm sways at fixed frequencies</text><rect x="350" y="44" width="300" height="160" rx="8" fill="none" stroke="#D3D1C7"/><text x="366" y="66" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="start">x_n(t): noise through a band-pass</text><line x1="370" y1="160" x2="630" y2="160" stroke="#D3D1C7"/><path d="M370 156 L440 156 Q460 92 480 156 L630 156" fill="none" stroke="#1D9E75" stroke-width="2"/><text x="460" y="176" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">f_n (damping ζ)</text><text x="625" y="176" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="end">Hz</text><text x="366" y="194" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start">frequency fixed; it does not follow speed</text><rect x="30" y="224" width="96" height="176" rx="8" fill="none" stroke="#D3D1C7"/><text x="78.0" y="246" font-size="12" font-weight="500" fill="#1D9E75" text-anchor="middle">s0</text><line x1="42" y1="340" x2="114" y2="340" stroke="#D3D1C7"/><path d="M42 312 L114 312" fill="none" stroke="#1D9E75" stroke-width="1.5"/><text x="78.0" y="356" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">speed →</text><text x="78.0" y="378" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle">level at rest</text><text x="78.0" y="394" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">servo holding</text><rect x="133" y="224" width="96" height="176" rx="8" fill="none" stroke="#D3D1C7"/><text x="181.0" y="246" font-size="12" font-weight="500" fill="#1D9E75" text-anchor="middle">keep</text><line x1="145" y1="340" x2="217" y2="340" stroke="#D3D1C7"/><path d="M145 300 L151 300 L163 330 L217 330" fill="none" stroke="#1D9E75" stroke-width="1.5"/><path d="M151 300 L217 300" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="3 2"/><text x="181.0" y="356" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">speed →</text><text x="181.0" y="378" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle">at rest only?</text><text x="181.0" y="394" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">0 removes it</text><rect x="236" y="224" width="96" height="176" rx="8" fill="none" stroke="#D3D1C7"/><text x="284.0" y="246" font-size="12" font-weight="500" fill="#1D9E75" text-anchor="middle">s1 · activity</text><line x1="248" y1="340" x2="320" y2="340" stroke="#D3D1C7"/><path d="M248 338 L320 284" fill="none" stroke="#1D9E75" stroke-width="1.5"/><text x="284.0" y="356" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">speed →</text><text x="284.0" y="378" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle">grows with</text><text x="284.0" y="394" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">speed</text><rect x="339" y="224" width="96" height="176" rx="8" fill="none" stroke="#D3D1C7"/><text x="387.0" y="246" font-size="12" font-weight="500" fill="#1D9E75" text-anchor="middle">s2</text><line x1="351" y1="340" x2="423" y2="340" stroke="#D3D1C7"/><path d="M351 338 L357 290 L423 290" fill="none" stroke="#1D9E75" stroke-width="1.5"/><text x="387.0" y="356" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">speed →</text><text x="387.0" y="378" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle">joint friction</text><text x="387.0" y="394" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">on while moving</text><rect x="442" y="224" width="96" height="176" rx="8" fill="none" stroke="#D3D1C7"/><text x="490.0" y="246" font-size="12" font-weight="500" fill="#1D9E75" text-anchor="middle">m_n</text><line x1="454" y1="310" x2="526" y2="310" stroke="#D3D1C7" stroke-dasharray="3 3"/><circle cx="466" cy="298" r="5" fill="#1D9E75"/><circle cx="490" cy="324" r="5" fill="#1D9E75"/><circle cx="514" cy="306" r="5" fill="#1D9E75"/><text x="490.0" y="356" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">runs 1, 2, 3</text><text x="490.0" y="378" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle">run multiplier</text><text x="490.0" y="394" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">not on s0</text><rect x="545" y="224" width="96" height="176" rx="8" fill="none" stroke="#D3D1C7"/><text x="593.0" y="246" font-size="12" font-weight="500" fill="#1D9E75" text-anchor="middle">frame</text><rect x="575" y="292" width="36" height="20" rx="3" fill="none" stroke="#888780" transform="rotate(-30 593 302)"/><line x1="593" y1="270" x2="593" y2="334" stroke="#1D9E75" stroke-width="2"/><line x1="587" y1="276" x2="593" y2="268" stroke="#1D9E75" stroke-width="2"/><line x1="599" y1="276" x2="593" y2="268" stroke="#1D9E75" stroke-width="2"/><text x="593.0" y="356" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">sensor turns</text><text x="593.0" y="378" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle">sensor or world</text><text x="593.0" y="394" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle">axes</text></svg>